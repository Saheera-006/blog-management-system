<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog | Add Blog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="container">

            <h1 class="logo">My Blog</h1>

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="blog.html" class="active">Add Blog</a></li>
                </ul>
            </nav>

        </div>

    </header>

    <!-- Main -->
    <main>

        <section class="form-section">

            <div class="form-card">

                <h2 id="formHeading">Add New Blog</h2>

                <p>Create and publish your blog post.</p>

                <form id="blogForm" onsubmit="return validateForm()">

                    <!-- Hidden Blog ID -->
                    <input type="hidden" id="blogId">

                    <label for="title">Blog Title</label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Enter blog title">

                    <small id="titleError"></small>

                    <label for="author">Author Name</label>

                    <input
                        type="text"
                        id="author"
                        placeholder="Enter author name">

                    <small id="authorError"></small>

                    <label for="content">Blog Content</label>

                    <textarea
                        id="content"
                        rows="6"
                        placeholder="Write your blog here..."></textarea>

                    <small id="contentError"></small>

                    <button
                        type="submit"
                        id="submitBtn">

                        Publish Blog

                    </button>

                </form>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>

        <p>&copy; 2026 My Blog. All Rights Reserved.</p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
