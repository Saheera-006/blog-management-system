<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog | Home</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="container">

            <h1 class="logo">My Blog</h1>

            <nav>
                <ul>
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="blog.html">Add Blog</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <!-- Main -->
    <main>

        <!-- Hero -->
        <section class="hero">

            <h2>Welcome to My Blog</h2>

            <p>
                Explore informative blog posts, share your ideas,
                and discover valuable insights on web development
                and technology.
            </p>

            <a href="blog.html" class="btn">
                Create a Blog
            </a>

        </section>

        <!-- Blogs -->
        <section class="blog-container" id="blogContainer">

        </section>

    </main>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal">

        <div class="modal-content">

            <h2>Delete Blog</h2>

            <p>Are you sure you want to delete this blog?</p>

            <div class="modal-buttons">

                <button onclick="closeModal()">
                    Cancel
                </button>

                <button id="confirmDelete">
                    Delete
                </button>

            </div>

        </div>

    </div>

    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 My Blog. All Rights Reserved.
        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
